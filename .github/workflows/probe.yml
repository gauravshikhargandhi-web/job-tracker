name: Probe careers sites

# One-off checks of what each careers site answers, used while building new readers.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/probe.py tools/probe_urls.txt probe_out
      - run: python tools/try_reader.py Apple Microsoft > probe_out/try_reader.txt 2>&1 || true
      - name: Save the answers to the probe branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe
          git rm -rfq --cached .
          git add probe_out
          git commit -qm "Probe $(date -u +%F-%H%M)"
          git push -f origin probe
