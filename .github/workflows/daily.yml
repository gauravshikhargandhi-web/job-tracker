name: Daily refresh

on:
  schedule:
    - cron: "0 12 * * *"  # every day at 12:00 UTC (7am Chicago in summer, 6am in winter)
  workflow_dispatch:       # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the job boards
        run: python -m tracker.run
      - name: Save the updated data
        # Runs even if a board failed or the run timed out, so the jobs already read are kept.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily refresh $(date -u +%F)"
          git push
