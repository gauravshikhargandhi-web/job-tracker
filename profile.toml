# What counts as a job for me. Not used by the daily data run, which saves every new US job:
# the daily Claude report (to be built) reads this file to decide which of the day's jobs to show me.
#
# Words are written in full, no short forms (MBA is the one exception,
# because job descriptions write it that way).

name = "GaGa"

# A job matches when its title has a word from any of these groups.
[titles]
product = [
  "product manager", "product management", "product lead", "product owner",
  "associate product manager", "technical product manager", "hardware product manager",
  "product operations", "product strategy", "product planning",
]
program = [
  "program manager", "program management", "program lead",
  "technical program manager", "engineering program manager",
  "new product introduction program manager", "product program manager",
  "operations program manager", "strategic program manager",
]
# Plain "project manager" is left out on purpose: it pulls in many construction and IT jobs.
project = ["technical project manager", "new product introduction project manager"]
new_product_and_manufacturing = [
  "new product introduction", "new product development", "new product", "product development",
  "product launch", "launch manager", "industrialization",
  "manufacturing program", "manufacturing operations", "manufacturing engineering manager", "manufacturing strategy",
  "operational excellence", "continuous improvement manager", "supply chain program",
]
sustainability = [
  "sustainability", "sustainable", "decarbonization", "climate", "carbon", "net zero",
  "environmental, social and governance", "energy transition", "circular economy", "circularity",
  "life cycle assessment", "environmental program",
]

# A job also matches, whatever its title, when its description has one of these.
[descriptions]
business_degree = [
  "MBA preferred", "MBA required", "MBA a plus", "MBA is a plus", "MBA or equivalent", "MBA graduate",
  "recent MBA", "post-MBA", "MBA program", "MBA class of", "MBA associate", "MBA degree", "MBA strongly preferred",
  "Master of Business Administration", "business administration", "master's in business",
  "masters in business", "advanced degree in business",
  "rotational program", "leadership development program",
]

[drop]
# Jobs whose title has any of these are dropped, even when a rule above matched.
titles = [
  # not a full-time job
  "intern", "internship", "co-op", "apprentice", "apprenticeship", "contractor", "temporary", "part-time",
  # too senior
  "director", "vice president", "head of", "principal", "staff",
  # other fields
  "construction", "property", "clinical", "nurse", "sales", "account manager",
  # factory floor
  "technician", "operator", "assembler", "machinist", "maintenance", "production associate",
  "line lead", "shift supervisor",
]
# Jobs whose description has any of these are dropped.
descriptions = [
  "security clearance", "top secret", "U.S. citizenship is required", "US citizenship is required",
  "must be a U.S. citizen", "must be a US citizen",
]
# Jobs where every listed place is one of these are dropped (places outside the US).
