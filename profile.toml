  "unable to sponsor", "not able to sponsor", "will not sponsor", "does not sponsor", "cannot sponsor",
  "not offer visa sponsorship", "not provide visa sponsorship", "without sponsorship",
  "without the need for sponsorship", "no visa sponsorship", "sponsorship is not available",
