# My target companies and where each one posts jobs. Built from company-map.xlsx (66 companies, A to Z).
#
# board = greenhouse | lever | ashby | workable | smartrecruiters : slug is the name in the board's address,
#   e.g. job-boards.greenhouse.io/stripe -> slug = "stripe", jobs.ashbyhq.com/openai -> slug = "openai".
# board = workday : url is the career site address, e.g. https://nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite
# board = amazon : no slug needed.
# board = "not_yet" : the company's own careers site, which needs its own reader; not read yet.
#
# To add a company, add a block. `python -m tracker.find "Company"` tries the usual Greenhouse, Lever and Ashby names.
# Lines marked "check" are guesses from the company map; the first run's data/summary.csv says whether they work.

